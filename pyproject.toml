[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-platform"
version = "1.0.0"
description = "Cloud-Native Delivery, Platform Engineering & Reliability Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "B008",  # Allow FastAPI Depends() in route function signatures
    "E501",  # Line length handled gracefully
]

[tool.ruff.lint.isort]
known-first-party = [
    "inventory_api",
    "platform_api",
    "incident_engine",
    "common_models",
    "experiment_runner",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "apps/inventory-api",
    "services/platform-api",
    "services/incident-engine",
    "packages/common-models",
    "packages/experiment-runner",
    ".",
]
