apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: titan-inventory-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/thowfiq-ahamed/Titan.git
    targetRevision: HEAD
    path: deploy/kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: titan-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
