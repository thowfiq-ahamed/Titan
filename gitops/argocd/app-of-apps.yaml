apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: titan-inventory-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/thowfiq-ahamed/Titan.git
    targetRevision: staging
    path: deploy/kustomize/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: titan-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: titan-inventory-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/thowfiq-ahamed/Titan.git
    targetRevision: main
    path: deploy/kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: titan-prod
  syncPolicy:
    automated:
      prune: false  # Production manual gate or protected automated sync
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: titan-platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thowfiq-ahamed/Titan.git
    targetRevision: HEAD
    path: gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
