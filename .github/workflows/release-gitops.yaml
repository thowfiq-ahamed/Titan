name: TITAN Release & GitOps Delivery

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: write
  packages: write

jobs:
  publish-and-sync:
    name: Build, Publish & Reconcile GitOps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Immutable Image Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "REGISTRY_IMAGE=ghcr.io/${{ github.repository }}/inventory-api" >> $GITHUB_OUTPUT

      - name: Build and Push Immutable Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/inventory-api
          file: ./apps/inventory-api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.REGISTRY_IMAGE }}:${{ steps.meta.outputs.IMAGE_TAG }}

      - name: Update GitOps Kustomize Overlay
        run: |
          cd deploy/kustomize/overlays/dev
          kustomize edit set image ghcr.io/titan-platform/titan-inventory-api:v1.0.0=${{ steps.meta.outputs.REGISTRY_IMAGE }}:${{ steps.meta.outputs.IMAGE_TAG }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(gitops): update inventory-api to ${{ steps.meta.outputs.IMAGE_TAG }} [skip ci]"
          git push origin main
