name: TITAN Release & GitOps Delivery

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish-and-sync:
    name: Build, Publish & Reconcile GitOps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Lowercase Image Reference & Immutable Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "REGISTRY_IMAGE=ghcr.io/${OWNER_LOWER}/titan-inventory-api" >> $GITHUB_OUTPUT

      - name: Build and Push Immutable Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/inventory-api
          file: ./apps/inventory-api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.REGISTRY_IMAGE }}:${{ steps.meta.outputs.IMAGE_TAG }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update GitOps Kustomize Overlay
        run: |
          cd deploy/kustomize/overlays/dev
          kustomize edit set image ghcr.io/thowfiq-ahamed/titan-inventory-api=${{ steps.meta.outputs.REGISTRY_IMAGE }}:${{ steps.meta.outputs.IMAGE_TAG }}
          kustomize build . > /dev/null

      - name: Create GitOps Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): update dev inventory-api to ${{ steps.meta.outputs.IMAGE_TAG }}"
          title: "chore(gitops): promote inventory-api ${{ steps.meta.outputs.IMAGE_TAG }} to dev"
          body: |
            ### Automated GitOps Deployment Gate
            - **Image:** `${{ steps.meta.outputs.REGISTRY_IMAGE }}:${{ steps.meta.outputs.IMAGE_TAG }}`
            - **Git Commit:** `${{ github.sha }}`
            - **Target Overlay:** `deploy/kustomize/overlays/dev`
            - **Branch Protection Safe:** Pull Request deployment workflow avoids direct unreviewed pushes to `main`.
          branch: "gitops/deploy-dev-${{ steps.meta.outputs.IMAGE_TAG }}"
          base: main
          delete-branch: true
