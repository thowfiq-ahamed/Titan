# ==============================================================================
# TITAN ELK Pipeline - Logstash Configuration
# Ingests structured JSON logs from TITAN microservices and indexes to Elasticsearch
# ==============================================================================

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => { "platform" => "titan" }
  }
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "titan-logs-%{+YYYY.MM.dd}"
  }
}
