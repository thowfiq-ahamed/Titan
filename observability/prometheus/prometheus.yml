global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "titan-inventory-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inventory-api:8001"]
        labels:
          environment: "development"
          service: "inventory-api"

  - job_name: "titan-platform-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["platform-api:8000"]
        labels:
          environment: "development"
          service: "platform-api"
