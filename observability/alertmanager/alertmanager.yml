global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'service', 'category']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'titan-incident-engine-webhook'

receivers:
  - name: 'titan-incident-engine-webhook'
    webhook_configs:
      - url: 'http://incident-engine:8002/api/v1/alerts'
        send_resolved: true
        http_config:
          bearer_token: 'dev-alertmanager-webhook-secret'
