apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  labels:
    app.kubernetes.io/name: inventory-api
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: inventory-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-api-config
data:
  ENVIRONMENT: "base"
  LOG_LEVEL: "INFO"
  ENABLE_FAULT_INJECTION: "false"
