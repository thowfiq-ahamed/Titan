apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: titan-dev
namePrefix: dev-

resources:
- ../../base

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: inventory-api

configMapGenerator:
- behavior: merge
  literals:
  - ENVIRONMENT=dev
  - LOG_LEVEL=DEBUG
  - ENABLE_FAULT_INJECTION=false
  name: inventory-api-config
images:
- name: ghcr.io/thowfiq-ahamed/titan-inventory-api
  newName: ghcr.io/thowfiq-ahamed/titan-inventory-api
  newTag: sha-c296b20
