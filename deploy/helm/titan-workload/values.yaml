replicaCount: 2

image:
  repository: ghcr.io/titan-platform/titan-inventory-api
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "titan-workload-sa"
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8001"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: inventory.titan.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

probes:
  startup:
    httpGet:
      path: /health/live
      port: 8001
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 10
  liveness:
    httpGet:
      path: /health/live
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health/ready
      port: 8001
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

env:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  ENABLE_FAULT_INJECTION: "false"

database:
  host: "titan-postgres.titan-prod.svc.cluster.local"
  port: 5432
  name: "titan_inventory"
  user: "titan_user"
  # In production, inject password from HashiCorp Vault or Kubernetes Secret
  existingSecret: "titan-db-credentials"
